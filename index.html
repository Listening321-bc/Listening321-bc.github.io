    <h1>咫尺山林与理性几何 —— 中西方绘画与园林艺术</h1>
    <p>本网站为《中西方绘画与园林艺术赏析》课程期末作业。</p>
    <p>中国古典园林以“虽由人作，宛自天开”为宗旨，园林是立体的山水画，追求写意、含蓄、曲径通幽。</p>
    <p>西方古典园林依托透视绘画理论，以中轴线、几何花坛、修剪树木塑造秩序，彰显人对自然的理性掌控。</p>
