<h1>关于本网站</h1>
<p>作品名称：咫尺山林与理性几何——中西方园林绘画与艺术</p>
<p>课程：中西方园林绘画与园林艺术赏析 期末作业</p>
<h2>网站设计思路</h2>
<p>以对比为核心，使用网页交互直观展示中西园林在造园思想、绘画美学上的差异。核心交互：分屏拖动对比、Tab切换赏析、明暗主题切换。</p>
<h2>素材说明</h2>
<p>图片来源：网络公开素材；前端代码引用开源轻量交互组件，用于课程学习作业。</p>
<h2>参考文献</h2>
<p>《中国古典园林史》周维权<br>《西方造园变迁史》针之谷钟吉</p>
